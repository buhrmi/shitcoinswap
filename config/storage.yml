test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

bunny:
  service: Bunny
  access_key: <%= Rails.application.credentials.dig(:bunny, :access_key) %>
  # the API key for cache purging
  api_key: <%= Rails.application.credentials.dig(:bunny, :api_key) %>
  storage_zone: shitcoinswap
  region: sg # leave blank for Falkenstein
  cdn: https://storage.shitcoinswap.com